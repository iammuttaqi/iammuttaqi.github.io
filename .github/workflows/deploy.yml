# https://github.com/actions/deploy-pages#usage
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # modules/resume-pdf.ts prints public/resume/*.pdf from the rendered
      # /resume page — the PDF is not in the repo, so this build is the only
      # thing that produces it. Chrome ships preinstalled on ubuntu-latest;
      # naming the path here means a runner image that drops it fails this step
      # instead of publishing a site whose résumé download 404s.
      - name: Build
        run: pnpm exec nuxt build --preset github_pages
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write # deploy to Pages
      id-token: write # verify the deployment origin

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5